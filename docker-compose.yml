services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ORIGIN=${ORIGIN:-${COOLIFY_URL:-http://localhost:3000}}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-${COOLIFY_URL:-http://localhost:5174}}
      - ADDRESS_HEADER=${ADDRESS_HEADER:-X-Forwarded-For}
      - XFF_DEPTH=${XFF_DEPTH:-1}
      - INTERNAL_POCKETBASE_URL=http://pocketbase:8090
      - POCKETBASE_URL=http://pocketbase:8090
      - POCKETBASE_ADMIN_EMAIL=${POCKETBASE_ADMIN_EMAIL:-}
      - POCKETBASE_ADMIN_PASSWORD=${POCKETBASE_ADMIN_PASSWORD:-}
      - RATE_LIMIT_SECRET=${RATE_LIMIT_SECRET:-}
      - AUTH_SECRET=${AUTH_SECRET:-}
      - POCKETBASE_PROXY_SECRET=${POCKETBASE_PROXY_SECRET:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    depends_on:
      - pocketbase
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  pocketbase:
    image: ghcr.io/muchobien/pocketbase:0.40.6@sha256:9a0be68a80ca1348ba8d15f217b3f983be4c094b3c571a09b3ebdeb357259338
    restart: unless-stopped
    command: serve --http=0.0.0.0:8090 --dir=/pb_data --publicDir=/pb_public --hooksDir=/pb_hooks --migrationsDir=/pb_migrations
    ports:
      - "127.0.0.1:${POCKETBASE_PORT:-8095}:8090"
    environment:
      - POCKETBASE_PROXY_SECRET=${POCKETBASE_PROXY_SECRET:-}
    volumes:
      - pb_data:/pb_data
      - ./pb_migrations:/pb_migrations
      - ./pb_hooks:/pb_hooks
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M

volumes:
  pb_data:
