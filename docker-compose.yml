services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - VITE_POCKETBASE_URL=http://localhost:8095
    depends_on:
      - pocketbase

  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    restart: unless-stopped
    command: serve --http=0.0.0.0:8090 --dir=/pb_data --publicDir=/pb_public --hooksDir=/pb_hooks --migrationsDir=/pb_migrations
    ports:
      - "${POCKETBASE_PORT:-8095}:8090"
    volumes:
      - pb_data:/pb_data
      - ./pb_migrations:/pb_migrations

volumes:
  pb_data:
